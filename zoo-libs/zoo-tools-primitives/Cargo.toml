[package]
name = "zoo-tools-primitives"
version = "1.1.35"
edition = "2021"
authors = [ "Zoo Foundation <dev@zoo.ngo>",]
description = "Model Context Protocol implementation"
license = "MIT"
repository = "https://github.com/zooai/node"
homepage = "https://zoo.ai"

[dependencies]
serde_json = "1.0.117"
regex = "1"
reqwest = "0.11.27"
base64 = "0.22.0"
log = "0.4.20"
once_cell = "1.19"

[workspace]

[dependencies.tokio]
version = "1.36"
features = [ "rt", "rt-multi-thread", "macros", "fs", "io-util", "net", "sync", "time",]

[dependencies.zoo_message_primitives]
version = "1.1.35"

# Use hanzo_tools_runner from crates.io (if published) or local path
[dependencies.hanzo_tools_runner]
version = "1.0.3"
# Or use local path until published:
# path = "../../../hanzo/node/crates/hanzo-tools-runner"
features = [ "built-in-tools",]

[dependencies.serde]
version = "1.0.219"
features = [ "derive",]

[dependencies.rmcp]
version = "0.6"
features = [ "client", "transport-child-process", "transport-sse-client",]

[dependencies.zoo_mcp]
version = "1.1.35"
