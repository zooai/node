name: Build zoo-node binaries

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build-binaries:
    name: Build binary
    strategy:
      matrix:
        include:
          - arch: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - arch: aarch64-apple-darwin
            os: macos-14
          - arch: x86_64-pc-windows-msvc
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Checkout hanzo-node dependency
        uses: actions/checkout@v4
        with:
          repository: hanzoai/node
          path: hanzo-node
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download tools from store to pre-install folder
        run: |
          ./scripts/update_tools.sh

      - name: Add hanzo workspace dependencies for CI build
        shell: bash
        run: |
          echo "" >> Cargo.toml
          echo "# Hanzo dependencies (added by CI for build)" >> Cargo.toml
          echo "hanzo_message_primitives = { path = \"hanzo-node/hanzo-libs/hanzo-message-primitives\" }" >> Cargo.toml
          echo "hanzo_crypto_identities = { path = \"hanzo-node/hanzo-libs/hanzo-crypto-identities\" }" >> Cargo.toml
          echo "hanzo_libp2p_relayer = { path = \"hanzo-node/hanzo-libs/hanzo-libp2p-relayer\" }" >> Cargo.toml
          echo "hanzo_job_queue_manager = { path = \"hanzo-node/hanzo-libs/hanzo-job-queue-manager\" }" >> Cargo.toml
          echo "hanzo_http_api = { path = \"hanzo-node/hanzo-libs/hanzo-http-api\" }" >> Cargo.toml
          echo "hanzo_tools_primitives = { path = \"hanzo-node/hanzo-libs/hanzo-tools-primitives\" }" >> Cargo.toml
          echo "hanzo_tools_runner = { path = \"hanzo-node/hanzo-libs/hanzo-tools-runner\" }" >> Cargo.toml
          echo "hanzo_sqlite = { path = \"hanzo-node/hanzo-libs/hanzo-sqlite\" }" >> Cargo.toml
          echo "hanzo_db = { path = \"hanzo-node/hanzo-libs/hanzo-db\" }" >> Cargo.toml
          echo "hanzo_hmm = { path = \"hanzo-node/hanzo-libs/hanzo-hmm\" }" >> Cargo.toml
          echo "hanzo_fs = { path = \"hanzo-node/hanzo-libs/hanzo-fs\" }" >> Cargo.toml
          echo "hanzo_embedding = { path = \"hanzo-node/hanzo-libs/hanzo-embedding\" }" >> Cargo.toml
          echo "hanzo_non_rust_code = { path = \"hanzo-node/hanzo-libs/hanzo-non-rust-code\" }" >> Cargo.toml
          echo "hanzo_mcp = { path = \"hanzo-node/hanzo-libs/hanzo-mcp\" }" >> Cargo.toml
          echo "hanzo_pqc = { path = \"hanzo-node/hanzo-libs/hanzo-pqc\" }" >> Cargo.toml
          echo "hanzo-kbs = { path = \"hanzo-node/hanzo-libs/hanzo-kbs\" }" >> Cargo.toml
          echo "hanzo_did = { path = \"hanzo-node/hanzo-libs/hanzo-did\" }" >> Cargo.toml
          echo "hanzo_config = { path = \"hanzo-node/hanzo-libs/hanzo-config\" }" >> Cargo.toml
          echo "hanzo_mining = { path = \"hanzo-node/hanzo-libs/hanzo-mining\" }" >> Cargo.toml
          echo "hanzo_wasm_runtime = { path = \"hanzo-node/hanzo-libs/hanzo-wasm-runtime\" }" >> Cargo.toml
          echo "hanzo_llm = { path = \"hanzo-node/hanzo-libs/hanzo-llm\" }" >> Cargo.toml
          echo "Updated Cargo.toml with ALL hanzo workspace dependencies:"
          tail -25 Cargo.toml

      - name: Configure rust-lld linker for Windows
        if: matrix.os == 'windows-2022'
        run: |
          if (-Not (Test-Path ".cargo")) { mkdir .cargo }
          echo '[target.x86_64-pc-windows-msvc]' > .cargo/config.toml
          echo 'linker = "rust-lld"' >> .cargo/config.toml

      - name: Cache cargo assets
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.arch }}-build-cargo-${{ hashFiles('**/Cargo.lock') }}


      - name: Build
        run: cargo build --release

      - name: Prepare bundle files
        env:
          ZIP_FILE_NAME: ${{ github.ref_name }}.zip
          EXTENSION: ${{ matrix.arch == 'x86_64-pc-windows-msvc' && '.exe' || '' }}
        run: |
          mkdir files-to-r2
          cp target/release/zoo_node${{ env.EXTENSION }} files-to-r2/zoo-node${{ env.EXTENSION }}
          cp -r target/release/zoo-tools-runner-resources files-to-r2/
          cd ./files-to-r2
          7z a -tzip ${{ env.ZIP_FILE_NAME}} . -sdel
          cp ${{ env.ZIP_FILE_NAME}} latest.zip

      - name: Upload bundle to R2 bucket
        uses: shallwefootball/s3-upload-action@master
        with:
          endpoint: https://94a3e3f299092abb1feda2a7481ea845.r2.cloudflarestorage.com
          aws_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws_bucket: zooai
          source_dir: files-to-r2
          destination_dir: ./zoo-node/binaries/production/${{ matrix.arch }}/

      - name: Upload bundle to release
        uses: svenstaro/upload-release-action@v2
        env:
          EXTENSION: ${{ matrix.arch == 'x86_64-pc-windows-msvc' && '.exe' || '' }}
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: files-to-r2/${{ github.ref_name }}.zip
          asset_name: zoo-node-${{ matrix.arch }}.zip
          tag: ${{ github.ref }}
          overwrite: true
  build-docker-image:
    name: Build and push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout hanzo-node dependency
        uses: actions/checkout@v4
        with:
          repository: hanzoai/node
          path: hanzo-node
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download tools from store to pre-install folder
        run: |
          ./scripts/update_tools.sh

      - name: Add hanzo workspace dependencies for CI build
        shell: bash
        run: |
          echo "" >> Cargo.toml
          echo "# Hanzo dependencies (added by CI for build)" >> Cargo.toml
          echo "hanzo_message_primitives = { path = \"hanzo-node/hanzo-libs/hanzo-message-primitives\" }" >> Cargo.toml
          echo "hanzo_crypto_identities = { path = \"hanzo-node/hanzo-libs/hanzo-crypto-identities\" }" >> Cargo.toml
          echo "hanzo_libp2p_relayer = { path = \"hanzo-node/hanzo-libs/hanzo-libp2p-relayer\" }" >> Cargo.toml
          echo "hanzo_job_queue_manager = { path = \"hanzo-node/hanzo-libs/hanzo-job-queue-manager\" }" >> Cargo.toml
          echo "hanzo_http_api = { path = \"hanzo-node/hanzo-libs/hanzo-http-api\" }" >> Cargo.toml
          echo "hanzo_tools_primitives = { path = \"hanzo-node/hanzo-libs/hanzo-tools-primitives\" }" >> Cargo.toml
          echo "hanzo_tools_runner = { path = \"hanzo-node/hanzo-libs/hanzo-tools-runner\" }" >> Cargo.toml
          echo "hanzo_sqlite = { path = \"hanzo-node/hanzo-libs/hanzo-sqlite\" }" >> Cargo.toml
          echo "hanzo_db = { path = \"hanzo-node/hanzo-libs/hanzo-db\" }" >> Cargo.toml
          echo "hanzo_hmm = { path = \"hanzo-node/hanzo-libs/hanzo-hmm\" }" >> Cargo.toml
          echo "hanzo_fs = { path = \"hanzo-node/hanzo-libs/hanzo-fs\" }" >> Cargo.toml
          echo "hanzo_embedding = { path = \"hanzo-node/hanzo-libs/hanzo-embedding\" }" >> Cargo.toml
          echo "hanzo_non_rust_code = { path = \"hanzo-node/hanzo-libs/hanzo-non-rust-code\" }" >> Cargo.toml
          echo "hanzo_mcp = { path = \"hanzo-node/hanzo-libs/hanzo-mcp\" }" >> Cargo.toml
          echo "hanzo_pqc = { path = \"hanzo-node/hanzo-libs/hanzo-pqc\" }" >> Cargo.toml
          echo "hanzo-kbs = { path = \"hanzo-node/hanzo-libs/hanzo-kbs\" }" >> Cargo.toml
          echo "hanzo_did = { path = \"hanzo-node/hanzo-libs/hanzo-did\" }" >> Cargo.toml
          echo "hanzo_config = { path = \"hanzo-node/hanzo-libs/hanzo-config\" }" >> Cargo.toml
          echo "hanzo_mining = { path = \"hanzo-node/hanzo-libs/hanzo-mining\" }" >> Cargo.toml
          echo "hanzo_wasm_runtime = { path = \"hanzo-node/hanzo-libs/hanzo-wasm-runtime\" }" >> Cargo.toml
          echo "hanzo_llm = { path = \"hanzo-node/hanzo-libs/hanzo-llm\" }" >> Cargo.toml
          echo "Updated Cargo.toml with ALL hanzo workspace dependencies:"
          tail -25 Cargo.toml

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./cloud-node/Dockerfile
          push: true
          build-args: |
            BUILD_TYPE=release
          tags: |
            zooai/zoo-node:${{ github.ref_name }}
            zooai/zoo-node:release-latest
