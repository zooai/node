[package]
name = "hanzo-runtime"
version = "1.1.12"
edition = "2021"
authors = ["Hanzo AI Inc"]
license = "Apache-2.0"
publish = false
repository = "https://github.com/hanzoai/hanzo-node"
homepage = "https://hanzo.ai"
description = "Wallet, x402 payment and document parsing functions for the Hanzo node"

[dependencies]
serde = { workspace = true, features = ['derive'] }
serde_json = { workspace = true }
tokio = { workspace = true }
hanzo-messages = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
base64 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
alloy-primitives = { workspace = true }
alloy-sol-types = { workspace = true }
alloy-dyn-abi = { workspace = true }
alloy-json-abi = { workspace = true }
k256 = { workspace = true }
coins-bip39 = { workspace = true }
calamine = { workspace = true }
pdf-extract = { workspace = true }
docx-rs = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
